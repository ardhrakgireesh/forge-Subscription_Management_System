{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block auth %}
<div class="card">
  <h2>Create your account</h2>
  <form method="post">
    <label>Name</label><input name="name" value="{{ name or '' }}" required>
    <label>Email</label><input type="email" name="email" value="{{ email or '' }}" required>
    <label>Password</label><input type="password" name="password" required>
    <p class="muted">More than 8 characters, with an uppercase letter, a lowercase letter and a special character.</p>
    <button type="submit">Sign up</button>
  </form>
  <p class="muted" style="margin-top:16px">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
