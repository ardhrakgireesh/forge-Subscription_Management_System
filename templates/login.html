{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block auth %}
<div class="card">
  <h2>Welcome back</h2>
  <p class="muted">Log in to manage your subscriptions.</p>
  <form method="post">
    <label>Email</label><input type="email" name="email" placeholder="you@company.com" required>
    <label>Password</label><input type="password" name="password" required>
    <button type="submit">Log in</button>
  </form>
  <p class="muted" style="margin-top:16px"><a href="{{ url_for('forgot') }}">Forgot password?</a> · <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
