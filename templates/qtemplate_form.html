{% extends "base.html" %}
{% block title %}New quotation template{% endblock %}
{% block heading %}New quotation template{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <form method="post">
    <label>Name</label>
    <input name="name" maxlength="100" value="{{ f.get('name', '') }}" placeholder="e.g. Starter pack" required>
    <label>Plan</label>
    <select name="plan_id" required>
      <option value="">Choose a plan…</option>
      {% for p in plans %}<option value="{{ p.id }}" {% if f.get('plan_id')|string == p.id|string %}selected{% endif %}>{{ p.name }} · ₹{{ '%.2f'|format(p.price) }} / {{ p.billing_period }}</option>{% endfor %}
    </select>
    <label>Quote is valid for (days)</label>
    <input type="number" name="validity_days" min="1" max="365" value="{{ f.get('validity_days', 30) }}" required>
    <button type="submit">Create template</button>
    <a class="btn secondary" href="{{ url_for('qt.templates') }}">Cancel</a>
  </form>
</div>
{% endblock %}
