{% extends "base.html" %}
{% block title %}Add staff{% endblock %}
{% block heading %}Add staff{% endblock %}
{% block content %}
<div class="card narrow">
  <h3>New staff member</h3>
  <p class="muted">Staff can manage customers day to day, with limited access. Only admins can add staff.</p>
  <form method="post">
    <label>Name</label><input name="name" required>
    <label>Email</label><input type="email" name="email" required>
    <label>Temporary password</label><input type="password" name="password" required>
    <button type="submit">Add staff</button>
  </form>
</div>
{% endblock %}
